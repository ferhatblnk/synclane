name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request or branch makes the run before it pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and every newer one.
        postgres: ["14", "15", "16", "17", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: synclane_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      SYNCLANE_TEST_DB: Host=localhost;Username=postgres;Database=synclane_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

  # Many installations reach PostgreSQL through PgBouncer in transaction mode. Every test runs through it here, except the
  # ones that listen for changes, which a pooler in that mode cannot carry: they go straight to the server, as
  # ListenConnectionString does in production.
  pooler:
    name: Through PgBouncer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: synclane_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      SYNCLANE_TEST_DB: Host=127.0.0.1;Port=6433;Username=postgres;Database=synclane_test
      SYNCLANE_TEST_LISTEN_DB: Host=127.0.0.1;Port=5432;Username=postgres;Database=synclane_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Start PgBouncer in transaction mode
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          cat > "$RUNNER_TEMP/pgbouncer.ini" <<EOF
          [databases]
          * = host=127.0.0.1 port=5432
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6433
          auth_type = trust
          auth_file = $RUNNER_TEMP/users.txt
          pool_mode = transaction
          default_pool_size = 40
          max_client_conn = 1000
          logfile = $RUNNER_TEMP/pgbouncer.log
          pidfile = $RUNNER_TEMP/pgbouncer.pid
          EOF
          echo '"postgres" ""' > "$RUNNER_TEMP/users.txt"
          /usr/sbin/pgbouncer -d "$RUNNER_TEMP/pgbouncer.ini"
          for attempt in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 6433 -U postgres && exit 0
            sleep 1
          done
          echo "::error::PgBouncer did not start."
          cat "$RUNNER_TEMP/pgbouncer.log"
          exit 1

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: PgBouncer's log
        if: failure()
        run: cat "$RUNNER_TEMP/pgbouncer.log"

  platforms:
    name: Unit tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The CLI is a tool people run on their own machines. Without SYNCLANE_TEST_DB the PostgreSQL tests are skipped.
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: No known vulnerable dependency
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::A dependency has a known vulnerability. Update it, or explain in the pull request why it cannot be."
            exit 1
          fi

      - name: Pack
        run: |
          for project in src/SyncLane src/SyncLane.Http src/SyncLane.Cli src/SyncLane.AspNetCore; do
            dotnet pack "$project" --configuration Release --no-build --output artifacts
          done

      # The tool carries its dependencies, so their licenses travel with it. A library added to it without its notice
      # fails here.
      - name: Every library the tool carries has its notice
        run: |
          bundled=$(unzip -Z1 artifacts/SyncLane.Cli.*.nupkg | grep -E '\.dll$' | xargs -n1 basename \
            | sed -E 's/(\.resources)?\.dll$//' | grep -v '^SyncLane' | sort -u)
          listed=$(awk '/^- /{ print $2 }' THIRD-PARTY-NOTICES.txt | sort -u)
          missing=$(comm -23 <(echo "$bundled") <(echo "$listed"))
          stale=$(comm -13 <(echo "$bundled") <(echo "$listed"))
          for name in $stale; do echo "::warning::THIRD-PARTY-NOTICES.txt lists $name, which the tool no longer carries."; done
          if [ -n "$missing" ]; then
            for name in $missing; do echo "::error::SyncLane.Cli carries $name, which THIRD-PARTY-NOTICES.txt does not list."; done
            exit 1
          fi

  sign-off:
    name: Signed off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every commit carries a "Signed-off-by:" line with its author's email: the author certifies the Developer
      # Certificate of Origin in DCO. Commits of bots, such as Dependabot's, are not people and are skipped.
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$sha")
            case "$email" in *"[bot]@users.noreply.github.com") continue ;; esac
            if ! git log -1 --format=%B "$sha" | grep -i '^Signed-off-by: ' | grep -qiF "<$email>"; then
              echo "::error::Commit $sha has no 'Signed-off-by:' line with its author's email ($email). Sign off with 'git commit -s'; for commits already made, 'git rebase --signoff origin/main' and push again. See CONTRIBUTING.md."
              missing=1
            fi
          done
          exit $missing
